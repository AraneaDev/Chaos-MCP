name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens/updates the Release PR from Conventional Commits. On merge of that
      # PR, creates the vX.Y.Z tag + GitHub Release and sets release_created=true.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs ONLY on the merge that cut a release. Because the
      # tag/release are made with GITHUB_TOKEN, no separate tag-triggered
      # workflow would fire — so build/verify/publish live here instead.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Preserve shebang on built entry point
        if: ${{ steps.release.outputs.release_created }}
        run: |
          node -e "
            const fs = require('fs');
            const path = './build/index.js';
            let content = fs.readFileSync(path, 'utf-8');
            if (!content.startsWith('#!/usr/bin/env node')) {
              fs.writeFileSync(path, '#!/usr/bin/env node\n' + content);
              console.log('Shebang restored in build/index.js');
            } else {
              console.log('Shebang already present');
            }
          "

      - name: Verify build
        if: ${{ steps.release.outputs.release_created }}
        run: |
          node ./build/index.js --version
          chmod +x ./build/index.js

      - name: Typecheck
        if: ${{ steps.release.outputs.release_created }}
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ steps.release.outputs.release_created }}
        run: npm run lint

      - name: Format check
        if: ${{ steps.release.outputs.release_created }}
        run: npm run format:check

      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      # Pre-release: not on npm yet. Intentionally dormant. To go public:
      # remove `if: false` and set up auth (Trusted Publishing / OIDC, or NPM_TOKEN).
      - name: Publish to npm (provenance)
        if: false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-container-images:
    name: Publish four mutation-engine images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container-images.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # A release whose images never reached GHCR is worse than a failed release: the
  # tag, the GitHub Release and the bumped `CONTAINER_IMAGE_VERSION` all say the
  # images exist, and every audit then fails on a manifest that was never pushed.
  # v4.2.2 shipped exactly that way.
  #
  # `always()`, not the default `success()`. The failure being guarded against is
  # the publish never STARTING, which leaves `publish-container-images` reporting
  # `failure` with no job, no log and no annotation to read. A throwaway probe of
  # that exact shape confirmed a downstream `always()` job still runs and still
  # sees `failure`, so this is reachable on the path that matters.
  #
  # The pull is anonymous on purpose: it asks what a user pulling the published
  # server gets, not what a token with `packages: read` can see. If these packages
  # are ever made private, this needs a registry login instead.
  verify-images:
    name: Verify the released images are pullable
    needs: [release-please, publish-container-images]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every engine image must exist at the released tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          missing=''
          for lang in typescript python rust php; do
            repo="araneadev/chaos-mcp-${lang}"
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${TAG}")
            echo "ghcr.io/${repo}:${TAG} -> ${code}"
            [ "${code}" = '200' ] || missing="${missing} ghcr.io/${repo}:${TAG}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::${TAG} was released without images:${missing}"
            exit 1
          fi
