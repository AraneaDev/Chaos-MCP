name: Container images

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: Image tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Image tag
        required: true
        default: edge

permissions:
  contents: read
  packages: write
  id-token: write

# One run per ref, never cancelled: an image push that is already underway is
# finished rather than abandoned half-written.
#
# The group name is hardcoded instead of interpolating `github.workflow`. Called
# through `workflow_call`, this workflow sees the CALLER's github context, so
# `github.workflow` would read `Release Please` and the group would come out
# identical to the caller's own. The callee would then queue for a group its
# caller holds, and the caller cannot finish until the callee does. That
# deadlock is what silently dropped the v4.2.2 images: the release run failed
# with no job, no log and no annotation.
concurrency:
  group: container-images-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, rust, php]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: echo "value=${REQUESTED_VERSION:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/${{ matrix.language }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/araneadev/chaos-mcp-${{ matrix.language }}:${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.language }}
