name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: the jobs below only read the repo. The one job
# that needs more (publishing the coverage badge to gh-pages) raises it for
# itself. Without this, every job on a PR ran with whatever the repository
# default grants.
permissions:
  contents: read

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  check:
    name: Full Check Pipeline (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release-please PR's diff is version files, the manifest, and a
      # CHANGELOG entry — nothing that build/lint/format/test/typecheck can
      # disagree with, because the code underneath is byte-identical to the
      # main it was cut from, which already passed this same pipeline. The
      # steps below re-verify that unchanged code, so they're skipped here.
      # The job itself still runs to completion and still reports success,
      # because branch protection requires this exact check by name — a job
      # that never reported would leave the release PR permanently blocked.
      # Guarded on the branch name release-please owns, not a path filter,
      # so it can't be fooled by a same-named branch carrying real changes.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        run: npm ci

      # The `npm run check` script runs all four stages sequentially:
      # build → lint → format:check → test
      # Using it as a single step ensures the same pipeline runs in CI
      # and locally. If any stage fails, subsequent stages are skipped
      # and the job fails — which becomes a required status check.
      - name: Run full check pipeline
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        run: npm run check

      # Separate typecheck step — runs even if `npm run check` fails,
      # so type errors are surfaced in CI logs regardless of which
      # pipeline stage failed first.
      - name: Typecheck
        if: ${{ always() && !startsWith(github.head_ref, 'release-please--branches--') }}
        run: npx tsc --noEmit

      # `tsc --noEmit` above uses tsconfig.json, which EXCLUDES src/__tests__ so
      # tests are never emitted into build/. The side effect was that nothing
      # type-checked the test suite at all (Vitest transpiles via esbuild, which
      # discards types), and 271 errors accumulated unnoticed. Those are now all
      # fixed, so this step is a hard gate: any type error in a test fails CI.
      - name: Typecheck tests
        if: ${{ always() && !startsWith(github.head_ref, 'release-please--branches--') }}
        run: npm run typecheck:tests

      # Smoke test the CLI binary: verify --validate-config and
      # --validate-config --strict exit with the expected codes and
      # report warnings correctly to stderr.
      - name: 'CLI: validate-config smoke tests'
        if: ${{ always() && !startsWith(github.head_ref, 'release-please--branches--') }}
        run: npx vitest run src/__tests__/cli-validate-config.test.ts

  # Coverage runs once, not per matrix entry: the numbers do not differ by Node version, and
  # a second upload would only race the first for the same commit on Codecov.
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Not a required check by name, so unlike `check` above this job can be
    # skipped outright rather than merely having its steps guarded: a release
    # PR changes no source, so coverage cannot have moved and there is
    # nothing new to badge. Keyed on the branch release-please owns.
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    permissions:
      contents: write # publishes the coverage badge to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test with coverage
        run: npm run test:coverage

      # Self-hosted coverage badge: the percentage is published as a shields endpoint on an
      # orphan `gh-pages` branch, force-pushed so it stays a single commit and never grows
      # history. Only on main, because a pull request must not be able to move the badge.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/badge
          node scripts/coverage-badge.mjs > /tmp/badge/coverage.json
          cat /tmp/badge/coverage.json
          cd /tmp/badge
          git init -q
          git checkout -q -b gh-pages
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'chore: publish coverage badge'
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  container-build:
    name: Container Build (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not a required check by name, so this job can be skipped outright: a
    # release PR touches version files and a changelog, never the Dockerfiles
    # or the code they package, so building four images here would only
    # reconfirm images that already built on main. Keyed on the branch
    # release-please owns.
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - language: typescript
            smoke-command: stryker --version
          - language: python
            smoke-command: cosmic-ray --version
          - language: rust
            smoke-command: cargo mutants --version
          - language: php
            smoke-command: infection --version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.language }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/${{ matrix.language }}/Dockerfile
          load: true
          push: false
          tags: chaos-mcp-${{ matrix.language }}:ci
          cache-from: type=gha,scope=container-${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.language }}

      - name: Smoke-test pinned mutation engine
        run: docker run --rm chaos-mcp-${{ matrix.language }}:ci ${{ matrix.smoke-command }}

      # The step above answers "is the engine installed", which is not the same
      # question as "can the engine run". `stryker --version` needs nothing but
      # the binary, so four releases shipped images without `ps` — which Vite
      # shells out to through @stryker-mutator/vitest-runner — and the first
      # containerised TypeScript audit died with `spawn ps ENOENT` during engine
      # startup. Assert the POSIX utilities the engines reach for are present,
      # so a base-image change cannot quietly drop one again.
      - name: Smoke-test the utilities the engines shell out to
        run: docker run --rm chaos-mcp-${{ matrix.language }}:ci sh -c 'command -v ps'
